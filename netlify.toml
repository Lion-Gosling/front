[build]
  command = "npm run build"
  publish = "dist" # CRA(Create React App)라면 build 로 변경

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

# React Router / Vue Router 등을 사용 중이라면 404 방지를 위해 아래 내용도 같이 작성해 주세요
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
